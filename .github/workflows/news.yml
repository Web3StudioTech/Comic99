name: Generate News Feed

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC (08:00, 14:00, 20:00, 02:00 KL)
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests feedparser python-dateutil

      - name: Generate news.json
        run: python .github/scripts/generate_news.py

      - name: Commit and push news.json
        run: |
          git config user.name "Comic99 Bot"
          git config user.email "bot@comic99.xyz"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: update news feed [skip ci]"
          git push
